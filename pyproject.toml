[project]
name = "photo-geotag"
version = "0.1.0"
description = "Give locations to photos that lack GPS, from a recorded track or a fallback location table."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["matplotlib>=3.8"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "Pillow>=10"]

[project.scripts]
photo-geotag = "photo_geotag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/photo_geotag"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
