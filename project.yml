name: PhotoGeotag

options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  xcodeVersion: "27.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic

targets:
  PhotoGeotagWatch:
    type: application
    platform: watchOS
    sources:
      - path: apps/WatchApp
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: apps/Shared
    settings:
      base:
        PRODUCT_NAME: PhotoGeotagWatch
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photogeotag.watchkitapp
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: apps/WatchApp/Info.plist
      properties:
        CFBundleDisplayName: Photo Track
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - en
          - zh-Hans
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.example.photogeotag
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: Photo Track requests workout authorization only to keep GPS recording alive in the background. It never reads or saves health data.
        NSHealthUpdateUsageDescription: Photo Track uses workout authorization solely to keep background GPS recording alive. It never saves a workout to Health.
        NSLocationWhenInUseUsageDescription: Photo Track records your location while a photo track is active.
        NSLocationAlwaysAndWhenInUseUsageDescription: Photo Track records your location in the background while a photo track is active.
    entitlements:
      path: apps/WatchApp/PhotoGeotagWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  PhotoGeotag:
    type: application
    platform: iOS
    sources:
      - path: apps/iOSApp
        excludes:
          - "Info.plist"
      - path: apps/Shared
    settings:
      base:
        PRODUCT_NAME: PhotoGeotag
        PRODUCT_BUNDLE_IDENTIFIER: com.example.photogeotag
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
    info:
      path: apps/iOSApp/Info.plist
      properties:
        CFBundleDisplayName: Photo Geotag
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleLocalizations:
          - en
          - zh-Hans
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - target: PhotoGeotagWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: "$(CONTENTS_FOLDER_PATH)/Watch"

schemes:
  PhotoGeotag:
    build:
      targets:
        PhotoGeotag: all
    run:
      config: Debug
  PhotoGeotagWatch:
    build:
      targets:
        PhotoGeotagWatch: all
    run:
      config: Debug
